name: WP.org Plugin Check

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        description: 'PHP version to use'
        required: true
        default: '8.3'
      include_composer_dependencies:
        description: "Setup composer dependencies"
        required: false
        type: boolean
        default: true

# The GITHUB_TOKEN used by Dependabot has read-only permissions
# by default, so we provide write permissions to this workflow
# so that comments can be left on the pull request.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#changing-github_token-permissions
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none
        tools: wp-cli

    - name: Run composer build
      if: inputs.include_composer_dependencies == true
      run: |
        composer install --no-dev --no-progress
        composer dump-autoload

    - name: Install latest version of dist-archive-command
      run: wp package install wp-cli/dist-archive-command:@stable

    - name: Build plugin
      id: build
      run: |
        # Create zip and capture the filename from the success message
        PLUGIN_ZIP=$(wp dist-archive . . | sed 's/Success: Created //')
        # Get plugin slug by removing version number and .zip extension
        PLUGIN_SLUG=$(echo "$PLUGIN_ZIP" | sed -E 's/[.][0-9]+[.][0-9]+[.][0-9]+[.]zip$//')
        mkdir tmp-build
        unzip "$PLUGIN_ZIP" -d tmp-build
        echo "slug=$PLUGIN_SLUG" >> $GITHUB_OUTPUT

    - name: Run plugin check
      uses: wordpress/plugin-check-action@v1.0.6
      with:
        build-dir: ./tmp-build/${{ steps.build.outputs.slug }}
